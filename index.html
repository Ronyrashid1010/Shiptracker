<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Shipment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: operations console — left rail of sections, a manifest-style grid, and a dashboard that reads as the route from supplier to final country. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#14222A; --muted:#5B6B70; --line:#D5DDDA;
  --accent:#0E6A73; --accent-soft:#D6ECEE; --accent-ink:#FFFFFF;
  --ok:#1E7B3A; --warn:#A35C00; --bad:#B42318; --info:#1D5FB0; --violet:#6B3FB0;
  --t-green:#E1F3E5; --t-blue:#E1EDFB; --t-purple:#EEE6FA; --t-orange:#FDE9D4; --t-red:#FBDFDC; --t-yellow:#FFF4C2;
  --shadow:0 10px 30px rgba(20,34,42,.14);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1417; --surface:#141F24; --surface-2:#1A272D; --ink:#E3EBE9; --muted:#93A3A7; --line:#27373D;
  --accent:#43B5BE; --accent-soft:#16363A; --accent-ink:#04181A;
  --ok:#62C97E; --warn:#EFA640; --bad:#F27A6E; --info:#73A9EE; --violet:#B497EE;
  --t-green:#15301E; --t-blue:#132A42; --t-purple:#281E3F; --t-orange:#3A2513; --t-red:#3D1917; --t-yellow:#34300E;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1417; --surface:#141F24; --surface-2:#1A272D; --ink:#E3EBE9; --muted:#93A3A7; --line:#27373D;
  --accent:#43B5BE; --accent-soft:#16363A; --accent-ink:#04181A;
  --ok:#62C97E; --warn:#EFA640; --bad:#F27A6E; --info:#73A9EE; --violet:#B497EE;
  --t-green:#15301E; --t-blue:#132A42; --t-purple:#281E3F; --t-orange:#3A2513; --t-red:#3D1917; --t-yellow:#34300E;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:16px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand-name{font-family:var(--f-display);font-weight:800;font-stretch:80%;font-size:20px;letter-spacing:.01em;text-transform:uppercase}
.login-card label{display:grid;gap:6px;font-weight:600;font-size:13px}
.err{color:var(--bad);font-size:13px;min-height:1em}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:232px 1fr;height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;gap:18px;position:sticky;top:0;height:100%;overflow:auto}
.rail nav{display:grid;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;font-weight:600;color:var(--muted)}
.navbtn svg{width:18px;height:18px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navbtn .count{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;background:var(--surface-2);color:var(--muted);padding:1px 7px;border-radius:99px}
.rail-foot{margin-top:auto;display:grid;gap:8px;font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column;height:100%;overflow:auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px}
.topbar h1{font-size:22px;font-weight:750;white-space:nowrap}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.iconbtn{position:relative;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}
.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 9px;font-size:13px}
.btn svg{width:16px;height:16px}
#view{padding-block:18px 40px;padding-inline:20px;display:grid;gap:18px;align-content:start;min-width:0}
.banner{border:1px dashed var(--warn);color:var(--warn);background:var(--t-orange);padding:8px 12px;border-radius:8px;font-size:13px}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters select,.filters input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-width:170px;font-size:13px}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600}
.chipcheck{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}

/* ---------- table ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:calc(100vh - 210px)}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
.grid th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid thead tr.groups th{top:0;text-align:center;color:var(--ink);background:var(--surface);border-right:1px solid var(--line)}
.grid thead tr.groups + tr th{top:35px}
.grid td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;background:var(--rowbg,var(--surface))}
.grid tbody tr{cursor:pointer}
.grid tbody tr:hover td{filter:brightness(.97)}
:root[data-theme="dark"] .grid tbody tr:hover td{filter:brightness(1.15)}
.grid .stick{position:sticky;left:0;z-index:1;border-right:1px solid var(--line)}
.grid th.stick{z-index:3}
.grid tr.cont td.stick{color:var(--muted)}
.tone-green{--rowbg:var(--t-green)} .tone-blue{--rowbg:var(--t-blue)} .tone-purple{--rowbg:var(--t-purple)}
.tone-orange{--rowbg:var(--t-orange)} .tone-red{--rowbg:var(--t-red)} .tone-yellow{--rowbg:var(--t-yellow)}
tr.dim td{opacity:.62}
.grid td input[type=text],.grid td input[type=date],.grid td select{padding:4px 6px;width:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px;max-width:170px}
.grid td.edit{overflow:visible}
.grid.fancy td.edit{max-width:none}

.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:650;border:1px solid currentColor;line-height:1.5;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{color:var(--ok)} .b-warn{color:var(--warn)} .b-bad{color:var(--bad)} .b-info{color:var(--info)} .b-violet{color:var(--violet)} .b-muted{color:var(--muted)}
.paycell.Pending{background:var(--t-red)} .paycell.Partial{background:var(--t-orange)} .paycell.Paid{background:var(--t-green)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress{display:flex;align-items:center;gap:8px}
.switch{appearance:none;width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;border:0;cursor:pointer;flex:none;vertical-align:middle}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--accent)} .switch:checked::after{left:16px}
.tick{width:18px;height:18px;accent-color:var(--ok)}

/* ---------- main: eye-catching ---------- */
.ph-chips{display:flex;flex-wrap:wrap;gap:8px}
.phchip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:650;font-size:13px}
.phchip i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.phchip b{font-family:var(--f-display);font-stretch:80%;font-size:16px;font-variant-numeric:tabular-nums;color:var(--pc)}
.phchip:hover{border-color:var(--pc)}
.phchip.on{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--surface));box-shadow:inset 0 0 0 1px var(--pc)}
.sc{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:650;line-height:1.5;background:color-mix(in srgb,var(--cc,var(--muted)) 15%,transparent);color:var(--cc,var(--muted));white-space:nowrap}
.c-ok{--cc:var(--ok)} .c-warn{--cc:var(--warn)} .c-bad{--cc:var(--bad)} .c-muted{--cc:var(--muted)} .c-info{--cc:var(--info)}
.av{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:10px;font-weight:750;background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);margin-right:7px;vertical-align:middle;letter-spacing:.02em;flex:none}
.stage{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);white-space:nowrap}
.bar.thick{height:8px;min-width:90px}
.grid.fancy td{padding:10px 12px}
.grid.fancy td.idcell{box-shadow:inset 5px 0 0 var(--pc);padding-left:16px}
.idcell small{display:block;font-size:11px;font-weight:700;letter-spacing:.02em}
.grid.fancy tr.cont td.idcell{box-shadow:inset 5px 0 0 color-mix(in srgb,var(--pc) 45%,transparent)}
.grid thead tr.groups th{font-family:var(--f-display);font-stretch:85%;font-size:12.5px;letter-spacing:.06em}
.band-a{background:var(--accent-soft)!important;color:var(--accent)!important}
.band-b{background:var(--t-yellow)!important;color:var(--warn)!important}
.band-c{background:var(--t-blue)!important;color:var(--info)!important}
.band-d{background:var(--t-green)!important;color:var(--ok)!important}
.grid td.ctr{text-align:center}
.card.stripe{border-left:5px solid var(--pc)}
.hub-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hub-sum>div{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pc,var(--accent));border-radius:10px;padding:12px 14px;display:grid;gap:2px}
.hub-sum b{font-family:var(--f-display);font-stretch:80%;font-size:28px;font-weight:750;color:var(--pc,var(--accent));font-variant-numeric:tabular-nums}
.hchecks{display:grid;gap:6px;padding-top:4px;border-top:1px solid var(--line)}
.hchk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 0}
@media (max-width:860px){.hub-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.supc{display:inline-flex;align-items:center}
.supc>span:last-child{display:grid;line-height:1.25}
.seq{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ttag{border:1px solid color-mix(in srgb,var(--cc) 45%,transparent)}
.expbar{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid th,.grid td{vertical-align:middle}
.grid td.r,.grid th.r{text-align:right}
.grid.fancy th{min-width:96px}
.klink{border:0;background:none;padding:2px 0;white-space:nowrap;display:inline-block;line-height:1.4;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:inherit}
.klink.knone{color:var(--muted);font-weight:600;text-decoration-style:dotted}
.drawer.track{width:min(820px,100%)}
.trk-hero{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:16px;display:grid;gap:14px}
.trk-top{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.trk-prod{font-family:var(--f-display);font-stretch:85%;font-size:22px;font-weight:750;margin:2px 0}
.trk-now{display:grid;justify-items:end;gap:4px;text-align:right}
.trk-now b{font-family:var(--f-display);font-stretch:85%;font-size:24px;color:var(--pc)}
.trk-route{display:flex;align-items:center;gap:8px}
.rt{display:grid;justify-items:center;gap:2px;text-align:center;min-width:0;flex:none;max-width:32%}
.rt i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line);background:var(--surface)}
.rt.on i{border-color:var(--ok);background:var(--ok)}
.rt.here i{box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 25%,transparent)}
.rt b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.rt-line{flex:1;height:3px;background:var(--line);border-radius:2px;margin-bottom:28px}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:10px;position:relative;padding-bottom:14px}
.tl li::before{content:"";position:absolute;left:13px;top:24px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li.done::before{background:var(--ok)}
.tl li>i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;border:2px solid var(--line);background:var(--surface);color:#fff;z-index:1}
.tl li.done>i{background:var(--ok);border-color:var(--ok)}
.tl li.cur>i{border-color:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 22%,transparent)}
.tl li.warn:not(.cur)>i{border-color:var(--warn)}
.tl li>div{display:grid;gap:1px;padding-top:2px}
.tl li b{font-size:14px}
.tl li span{font-size:12.5px;color:var(--muted)}
.tl li.cur b{color:var(--warn)}
.tl li:not(.done):not(.cur) b{color:var(--muted);font-weight:600}
.trk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 18px;margin:0}
.trk-grid>div{display:grid;gap:2px;min-width:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trk-grid dt{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.trk-grid dd{margin:0;overflow-wrap:anywhere}
@media (prefers-reduced-motion:no-preference){.tl li.cur>i{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--warn) 10%,transparent)}}
.permit-alert{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface));border-radius:12px;padding:14px 16px;display:grid;gap:12px}
.pa-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pa-h>div{flex:1;min-width:220px;display:grid;gap:2px}
.pa-h b{font-family:var(--f-display);font-stretch:85%;font-size:18px;color:var(--ok)}
.pa-h span{color:var(--muted);font-size:13px}
.pa-h .pa-icon{color:#fff;width:34px;height:34px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid!important;place-items:center;font-weight:800;font-size:17px!important;flex:none}
.pa-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.pa-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.pa-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pa-date{margin-left:auto;font-size:12px;color:var(--ok);font-weight:700}
.pa-next{font-size:12.5px;font-weight:650;color:var(--ok)}
.pa-hub{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}.pa-hub select{padding:4px 8px;border:1px solid var(--ok);border-radius:6px;background:var(--surface)}
.jobgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:1180px){.jobgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){.jobgrid{grid-template-columns:1fr 1fr}.bottomnav button{font-size:9.5px}}
.grid.fancy td .ce{border:1px solid transparent;background-color:transparent;padding:4px 6px;border-radius:6px;font:inherit;font-size:13px;color:inherit;max-width:none;min-width:0;cursor:pointer}
.grid td input.ce{cursor:text}
.ce:hover{border-color:var(--line)!important;background:var(--surface)!important}
.ce:focus{border-color:var(--accent)!important;background:var(--surface)!important;outline:none;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.grid.fancy td select.ce{appearance:none;-webkit-appearance:none;padding-right:18px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%)!important;background-position:calc(100% - 9px) 52%,calc(100% - 5px) 52%!important;background-size:4px 4px,4px 4px!important;background-repeat:no-repeat!important}
.grid.fancy td .ce.cs,.cardedit .ce.cs{font-weight:650;font-size:12px;color:var(--cc,var(--muted));background-color:color-mix(in srgb,var(--cc,var(--muted)) 14%,transparent)!important}
.ce.cs:hover,.ce.cs:focus{background-color:var(--surface)!important}
.ce.cb{font-weight:700}
.ce.cd{width:132px}
.ce.cpay{font-weight:700}
.ce option{color:var(--ink);background:var(--surface);font-weight:400}
.cpair{display:inline-flex;align-items:center;gap:4px}
.idbtn{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;display:grid}
.idbtn .mono{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.idbtn:hover .mono{color:var(--accent)}
.trk{border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;flex:none}
.trk:hover{border-color:var(--accent)}
.cardedit .ce{border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.edit-hint{font-size:12.5px;color:var(--muted)}
.grid.fancy td .ce.blank{background-color:transparent!important;color:var(--muted);font-weight:400}
.grid.fancy td input[type=date].ce.blank:not(:focus):not(:hover){color:transparent}
.grid.fancy td input[type=date].ce.blank:not(:focus):not(:hover)::-webkit-calendar-picker-indicator{opacity:.25}
.grid.fancy tr:hover td .ce.blank{color:var(--muted)}
.hticks{display:inline-flex;gap:10px;align-items:center}

const MAXB=1024,DROP=new Set(["_id","progress"]);

/* ================= business logic ================= */
function autoStage(s){
  const t=today();let d=1;
  if(s.supplier_inv)d=2;
  if(s.permit==="Received")d=Math.max(d,7);
  const docs={"Pending":3,"Docs Dispatched":4,"Docs Received":5,"Complete":5}[s.docs];if(docs)d=Math.max(d,docs);
  if(s.artwork==="Yes")d=Math.max(d,9);
  if(s.attestation==="Yes")d=Math.max(d,10);
  if(s.booking)d=Math.max(d,11);
  if((s.etd&&s.etd<=t)||(s.shipped_date&&s.shipped_date<=t))d=Math.max(d,12);
  if(s.hub_date&&s.hub_date<=t)d=Math.max(d,13);
  if(s.final_date&&s.final_date<=t)d=Math.max(d,15);
  if(s.final_date&&s.final_date<=t&&s.payment==="Paid")d=Math.max(d,16);
  if(s.second_release)d=Math.max(d,17);
  if(s.released)d=18;
  return d;
}
function progress(s){
  const st=+s.stage||1;
  if(st>=18)return 100;
  if(s.second_release&&!s.released)return 90;
  if(st===14)return 75;
  if(st>=11&&st<=13)return 50;
  const base=Math.round(st/18*100);
  if(s.payment==="Paid"&&(s.docs==="Docs Received"||s.docs==="Complete")&&base<30)return 30;
  return base;
}
function tone(s){
  if(s.flag==="cancelled")return"red";
  if(s.flag==="hold")return"orange";
  if(+s.stage>=18)return"green";
  if(s.second_release&&!s.released)return"yellow";
  if(+s.stage>=11&&+s.stage<=15)return"green";
  if(s.final_date&&s.final_date<=today())return"green";
  return"";
}
const isDone=s=>+s.stage>=18;
const inMain=s=>!isDone(s)&&!s.second_release&&!inHub(s);
const inRelease=s=>!!s.second_release&&!isDone(s);
function phase(s){
  const t=today(),st=+s.stage||1;
  if(isDone(s)||s.released)return"done";
  if(s.second_release)return"analysis";
  if(st===14)return"customs";
  if((s.final_date&&s.final_date<=t)||st>=15)return"arrived";
  if((s.hub_date&&s.hub_date<=t)||st===13)return"hub";
  if((s.shipped_date&&s.shipped_date<=t)||(s.etd&&s.etd<=t)||st===12)return"transit";
  if(s.etd||s.booking||st===11)return"booked";
  return"supplier";
}
function whereText(s){
  const t=today(),p=phase(s);
  switch(p){
    case"supplier":return s.docs?("Docs: "+s.docs):"Awaiting documents";
    case"booked":return s.etd?("ETD "+fds(s.etd)+" · in "+diff(t,s.etd)+"d"):"Booking "+(fd(s.booking)||"made");
    case"transit":{const dep=s.shipped_date||s.etd;return(s.method?s.method+" · ":"")+(dep?"shipped "+fds(dep)+" · day "+diff(dep,t):"on the way")}
    case"hub":return(s.transit_hub||"Hub")+(s.hub_date?" since "+fds(s.hub_date):"");
    case"customs":return"In clearance";
    case"arrived":return"Arrived "+destOf(s)+(s.final_date?" "+fds(s.final_date):"");
    case"analysis":return s.date_submitted?("Submitted "+fds(s.date_submitted)+" · "+diff(s.date_submitted,t)+"d"):"Not submitted yet";
    case"done":return s.release_date?"Released "+fds(s.release_date):"Completed";
  }
}

/* release automation */
function applyRelease(s,patch){
  Object.assign(s,patch);
  if("second_release"in patch){
    if(s.second_release){if(!s.r_status)s.r_status="Under Analysis";if(!s.arrival_date&&s.final_date)s.arrival_date=s.final_date;s.stage=Math.max(+s.stage||1,17)}
    else{if(!s.released&&+s.stage===17)s.stage=Math.min(16,autoStage({...s,second_release:false}))}
  }
  if("date_submitted"in patch&&s.date_submitted&&!s.released&&s.r_status!=="On Hold"&&s.r_status!=="Cancelled")s.r_status="Under Analysis";
  if("released"in patch){
    if(s.released){
      if(s.payment&&s.payment!=="Paid")toast("Heads up: payment is still "+s.payment+" for "+s.shipment_id);
      s.r_status="Released";s.completion="Completed";s.release_date=today();s.stage=18;if(s.flag==="hold")s.flag="";
    }else{s.r_status="Under Analysis";s.completion="";s.release_date="";s.stage=17}
  }
  if("r_status"in patch){
    if(s.r_status==="Released"&&!s.released){s.released=true;s.completion="Completed";s.release_date=today();s.stage=18}
    if(s.r_status!=="Released"&&s.released&&!("released"in patch)){s.released=false;s.completion="";s.release_date="";s.stage=17}
    s.flag=s.r_status==="On Hold"?"hold":s.r_status==="Cancelled"?"cancelled":(s.flag==="hold"||s.flag==="cancelled"?"":s.flag);
  }
  if("stage"in patch&&+s.stage===18&&s.second_release&&!s.released){s.released=true;s.r_status="Released";s.completion="Completed";s.release_date=today()}
  return s;
}

function alerts(){

  permitReady().forEach(s=>out.push({lvl:"good",id:s._id,txt:"MOH import permit received: choose Transit Hub"+(s.supplier_inv?" · Inv "+s.supplier_inv:"")+(s.distributor?" · "+s.distributor:""),sub:(s.shipment_id||"—")+" · "+(s.product||s.supplier||""),o:0}));
  S.ships.forEach(s=>{
    if(isDone(s)||s.flag==="cancelled")return;
    const id=s._id,label=(s.shipment_id||"—")+" · "+(s.product||s.supplier||"");
    if(s.etd&&s.etd>t&&diff(t,s.etd)<=st.etdDays)out.push({lvl:"info",id,txt:"ETD in "+diff(t,s.etd)+" day"+(diff(t,s.etd)===1?"":"s"),sub:label,o:1});
    if(s.etd&&s.etd<=t&&!s.final_date&&!s.second_release&&diff(s.etd,t)>=14)out.push({lvl:"warn",id,txt:"Departed "+diff(s.etd,t)+" days ago, no arrival recorded",sub:label,o:2});
    if((!s.docs||s.docs==="Pending")&&s.type!=="Documents")out.push({lvl:"warn",id,txt:"Supplier documents pending",sub:label,o:4});
    if((s.payment==="Pending"||s.payment==="Partial")&&(+s.stage>=12||s.final_date))out.push({lvl:"bad",id,txt:"Payment "+s.payment.toLowerCase()+" after dispatch",sub:label,o:3});
    if(s.second_release&&!s.released){
      if(!s.date_submitted)out.push({lvl:"warn",id,txt:"2nd release: analysis not submitted",sub:label,o:2});
      else if(diff(s.date_submitted,t)>st.analysisDays)out.push({lvl:"bad",id,txt:"Under analysis for "+diff(s.date_submitted,t)+" days",sub:label,o:1});
      if(!s.arrival_date&&!s.final_date)out.push({lvl:"warn",id,txt:"Under analysis but arrival date missing",sub:label,o:3});
      if(s.payment==="Pending")out.push({lvl:"bad",id,txt:"Payment pending ahead of release",sub:label,o:3});
    }
  });
  const rank={good:0,bad:1,warn:2,info:3};
  return out.sort((a,b)=>rank[a.lvl]-rank[b.lvl]||a.o-b.o);
}

/* search & filters */
function matchQ(s){
  const q=S.q.trim().toLowerCase();if(!q)return true;
  return["shipment_id","po","supplier_inv","kepler_inv","clearance_inv","tracking","product","supplier"].some(k=>String(s[k]||"").toLowerCase().includes(q));
}
function filtered(list,f){
  return list.filter(s=>matchQ(s)&&Object.entries(f).every(([k,v])=>{
    if(!v)return true;
    if(k==="stage")return String(+s.stage||1)===v;
    if(k==="phase")return phase(s)===v;
    if(k==="r_status")return(s.r_status||"Under Analysis")===v;
    if(k==="sub_from")return s.date_submitted&&s.date_submitted>=v;
    if(k==="sub_to")return s.date_submitted&&s.date_submitted<=v;
    if(k==="arr_from")return(s.arrival_date||s.final_date)&&(s.arrival_date||s.final_date)>=v;
    if(k==="arr_to")return(s.arrival_date||s.final_date)&&(s.arrival_date||s.final_date)<=v;
    return(s[k]||"")===v;
  }));
}
function opts(list,val,blank="—"){
  const arr=[...list];if(val&&!arr.includes(val))arr.push(val);
  return(blank!==null?`<option value="">${esc(blank)}</option>`:"")+arr.map(v=>`<option value="${esc(v)}"${v===val?" selected":""}>${esc(v)}</option>`).join("");
}

function timeline(list){

  }).sort((a,b)=>String(a.etd||a.booking||"").localeCompare(String(b.etd||b.booking||"")));
  let ticks="";for(let i=0;i<=span;i++){const d=addDays(start,i),dd=parse(d).getDate();if(dd===1||dd===15)ticks+=`<span style="left:${pos(d)}%">${fds(d)}</span>`}
  ticks+=`<span class="today" style="left:${pos(t)}%;top:-14px">Today</span>`;

  h+=`<div class="timeline"><div class="tl-inner"><div class="tl-axis"><span></span><div class="tl-ticks">${ticks}</div></div>`;
  rows.forEach(s=>{
    const a=s.shipped_date||s.etd||s.booking,fin=s.final_date;
    let bar="";
    if(a){const b=fin||(a<=t?t:null);if(b){const l=pos(a),r=pos(b);bar=`<div class="tl-bar ${fin?(isDone(s)?"done":""):"open"}" style="left:${l}%;width:${Math.max(.6,r-l)}%"></div>`}}
    let m="";
    if(s.etd)m+=`<span class="tl-m etd${s.etd>t?" future":""}" style="left:${pos(s.etd)}%" title="ETD ${fd(s.etd)}"></span>`;
    if(s.hub_date)m+=`<span class="tl-m hub" style="left:${pos(s.hub_date)}%" title="Hub ${fd(s.hub_date)}"></span>`;
    if(fin)m+=`<span class="tl-m fin" style="left:${pos(fin)}%" title="Arrived ${fd(fin)}"></span>`;
    h+=`<div class="tl-row" data-open="${esc(s._id)}" role="button" tabindex="0"><div class="tl-lab"><b>${esc(s.shipment_id)} · ${esc(s.method||"")}</b><span>${esc(s.product||s.supplier||"")}</span></div><div class="tl-track"><div class="tl-today" style="left:${pos(t)}%"></div>${bar}${m}</div></div>`;
  });
  return h+`</div></div>`;
}

/* per-supplier numbering by date: earliest arrival/ETD first */
let SEQ={};
function computeSeq(){
  SEQ={};const by={};
  const key=s=>s.final_date||s.hub_date||s.shipped_date||s.etd||s.booking||s.initiated||"9999-99-99";
  S.ships.forEach(s=>{if(!s.supplier||s.flag==="cancelled")return;const sup=by[s.supplier]=by[s.supplier]||{};const id=s.shipment_id||s._id;const k=key(s);if(!sup[id]||k<sup[id])sup[id]=k});
  Object.entries(by).forEach(([sup,m])=>{const ids=Object.keys(m).sort((a,b)=>m[a].localeCompare(m[b])||a.localeCompare(b,undefined,{numeric:true}));ids.forEach((id,i)=>SEQ[sup+"|"+id]={n:i+1,t:ids.length})});
}

function typeTag(v){if(!v)return"";const c=TYPEC[v]||"var(--bad)";return`<span class="sc ttag" style="--cc:${c}">${esc(v)}</span>`}
function chipClass(v){const ok=["Yes","Complete","Docs Received","Docs Dispatched","Received","Full","Paid","Released","Completed"],warn=["Pending","Waiting","Partial","Required"];return!v?"muted":ok.includes(v)?"ok":warn.includes(v)?"warn":v==="No"?"bad":"muted"}
function sortRecent(list){
  const g={};list.forEach(s=>{const k=s.shipment_id||s._id;g[k]=Math.max(g[k]||0,+s.created||0)});
  return[...list].sort((a,b)=>{const ka=a.shipment_id||a._id,kb=b.shipment_id||b._id;return(g[kb]-g[ka])||String(kb).localeCompare(String(ka),undefined,{numeric:true})||((+a.created||0)-(+b.created||0))});

async function inlineEdit(id,k,v){

  if(k==="flag"&&s.second_release&&!s.released){s.r_status=v==="hold"?"On Hold":v==="cancelled"?"Cancelled":"Under Analysis"}

  if(JOB_SYNC.some(([,sk])=>sk===k))await syncShipToJob(s);

const JOB_SYNC=[["date","initiated"],["po","po"],["supplier","supplier"],["type","type"],["supplier_inv","supplier_inv"],["distributor","distributor"]];
const normPO=v=>String(v||"").trim().toLowerCase();
function jobShips(j){return S.ships.filter(s=>s.job_id===j._id||(!s.job_id&&j.po&&normPO(s.po)===normPO(j.po)))}
function jobFor(s){return(s.job_id&&S.jobs.find(j=>j._id===s.job_id))||(s.po&&S.jobs.find(j=>normPO(j.po)===normPO(s.po)))||null}
function jobStatus(j){const sh=jobShips(j);if(!sh.length)return["Open","warn"];if(sh.every(isDone))return["Completed","ok"];return["Linked","info"]}
function nextJobId(){let m=0;S.jobs.forEach(j=>{const n=parseInt(String(j.job_id||"").replace(/\D/g,""),10);if(n>m)m=n});return"JOB-"+String(m+1).padStart(3,"0")}
function fillFromGroup(s){const sup=S.settings.suppliers.find(x=>x.name===s.supplier);if(!sup||!sup.group)return;s.group=sup.group;const g=S.settings.groups.find(x=>x.name===sup.group);if(g){if(g.country)s.country=g.country;if(g.ref)s.ref_std=g.ref;if(g.coa)s.coa=g.coa}}
async function syncJobToShips(j,keys){
  const back={};
  for(const s0 of jobShips(j)){
    const s=structuredClone(s0);let ch=s.job_id!==j._id;s.job_id=j._id;
    JOB_SYNC.forEach(([jk,sk])=>{
      if(keys&&!keys.includes(jk))return;
      const jv=j[jk]||"",sv=s[sk]||"";if(jv===sv)return;
      if(keys||jv){s[sk]=jv;ch=true;if(sk==="supplier")fillFromGroup(s)}   // an edit, or job has a value: job wins
      else if(sv){back[jk]=sv}                                             // first link: fill job gaps from shipment
    });
    if(ch){s.stage=Math.max(+s.stage||1,autoStage(s));s.progress=progress(s);await persist(s)}
  }
  if(Object.keys(back).length){const jj=structuredClone(S.jobs.find(x=>x._id===j._id)||j);Object.assign(jj,back);await persistJob(jj)}
}
async function syncShipToJob(s){
  const j0=jobFor(s);if(!j0)return;const j=structuredClone(j0);let ch=false;
  JOB_SYNC.forEach(([jk,sk])=>{if(s[sk]&&(j[jk]||"")!==s[sk]){j[jk]=s[sk];ch=true}});
  if(ch)await persistJob(j);
}
async function addJob(){
  const d={...S.jobDraft};["date","po","supplier","type","supplier_inv","distributor"].forEach(k=>d[k]=String(d[k]??"").trim());
  if(!d.date)d.date=today();
  if(!d.po&&!d.supplier_inv){toast("Enter a PO Number or Supplier Invoice to open a job");return}
  if(d.po&&S.jobs.some(j=>normPO(j.po)===normPO(d.po))){toast("A job with PO "+d.po+" already exists");return}
  const j={_id:"j"+newId().slice(1),job_id:nextJobId(),created:Date.now(),...d};
  S.jobDraft={};const ae=document.activeElement;if(ae)ae.blur();
  await persistJob(j);
  const linked=jobShips(j);
  if(linked.length){await syncJobToShips(j);toast(j.job_id+" opened and linked to "+linked.map(s=>s.shipment_id).join(", "))}
  else toast(j.job_id+" opened");
}

async function updateJob(id,k,v){
  const j=structuredClone(S.jobs.find(x=>x._id===id));if(!j||(j[k]||"")===v)return;
  if(k==="po"&&v&&S.jobs.some(x=>x._id!==id&&normPO(x.po)===normPO(v))){toast("Another job already uses PO "+v);render(true);return}
  const before=jobShips(j);j[k]=v;
  await persistJob(j);
  for(const s0 of before){if(s0.job_id!==j._id){const s=structuredClone(s0);s.job_id=j._id;await persist(s)}}

const inHub=s=>!!(s&&s.permit==="Received"&&s.transit_hub&&s.flag!=="cancelled"&&!isDone(s)&&!s.second_release);

function setArrived(s,on){
  const t=today();
  if(on){
    s.final_arrived=true;
    if(!s.final_date||s.final_date>t)s.final_date=t;
    if(!s.final_country)s.final_country=S.settings.destCountry||"";

}

}

  return s;
}

function relReport(all){
  const t=today(),act=all.filter(inRelease),rel=all.filter(s=>s.released||isDone(s));
  const ua=act.filter(s=>(s.r_status||"Under Analysis")==="Under Analysis").length,oh=act.filter(s=>s.r_status==="On Hold").length;
  const mon=t.slice(0,7),relM=rel.filter(s=>(s.release_date||"").startsWith(mon)).length;
  const durs=rel.filter(s=>s.date_submitted&&s.release_date).map(s=>diff(s.date_submitted,s.release_date));
  const avg=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):null;
  const pend=act.filter(s=>s.date_submitted).map(s=>diff(s.date_submitted,t));const oldest=pend.length?Math.max(...pend):null;
  const by={};all.forEach(s=>{const k=s.supplier||"—";by[k]=by[k]||{a:0,r:0,d:[]};if(inRelease(s))by[k].a++;else{by[k].r++;if(s.date_submitted&&s.release_date)by[k].d.push(diff(s.date_submitted,s.release_date))}});
  let h=`<div class="panel"><div class="panel-h"><h2>2nd Release report</h2><span class="expbar"><button class="btn small primary" type="button" data-exp="report">Export full report (Excel)</button><button class="btn small" type="button" data-copy="report">Copy for Excel</button></span></div>
   <div class="hub-sum">

    <div style="--pc:var(--ok)"><span class="eyebrow">Released this month</span><b>${relM}</b><span style="font-size:12px;color:var(--muted)">${rel.length} released in total</span></div>
    <div style="--pc:var(--info)"><span class="eyebrow">Avg. days in analysis</span><b>${avg==null?"—":avg}</b><span style="font-size:12px;color:var(--muted)">${oldest==null?"No open analysis dated":"Oldest open: "+oldest+" days"}</span></div>

  if(rows.length)h+=`<div style="overflow-x:auto"><table class="mtable"><thead><tr><th>Supplier</th><th class="num">Under analysis</th><th class="num">Released</th><th class="num">Avg. days</th></tr></thead><tbody>${rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.a}</td><td class="num">${v.r}</td><td class="num">${v.d.length?Math.round(v.d.reduce((a,b)=>a+b,0)/v.d.length):"—"}</td></tr>`).join("")}</tbody></table></div>`;
  h+=`<p style="margin:0;font-size:12.5px;color:var(--muted)">The full report has every 2nd Release shipment, including the ones now in Completed. Each row carries all Main Shipments columns plus the analysis and release details.</p></div>`;
  return h;
}

function fieldHtml(key,label,kind,s,auto){

  else if(kind==="money")inp=`<input id="${id}" name="${key}" type="number" step="0.01" min="0" value="${esc(v)}" placeholder="${esc(st.currency)}">`;
  else if(kind.startsWith("list:"))inp=`<select id="${id}" name="${key}">${opts(L(kind.slice(5)),v)}</select>`;
  else if(kind==="supplier")inp=`<select id="${id}" name="${key}">${opts(st.suppliers.map(x=>x.name),v)}</select>`;
  else if(kind==="group")inp=`<select id="${id}" name="${key}">${opts(st.groups.map(x=>x.name),v)}</select>`;
  else if(kind==="distributor")inp=`<select id="${id}" name="${key}">${opts(st.distributors,v)}</select>`;
  else if(kind==="country")inp=`<select id="${id}" name="${key}">${opts(st.countries,v)}</select>`;
  else if(kind==="stage")inp=`<select id="${id}" name="${key}">${STAGES.map((n,i)=>`<option value="${i+1}"${(+v||1)===i+1?" selected":""}>${i+1}. ${esc(n)}</option>`).join("")}</select>`;
  return`<label class="fld${auto?" auto":""}"><span>${esc(label)}</span>${inp}</label>`;
}

function milestones(s){
  const t=today(),st=+s.stage||1,past=d=>d&&d<=t;
  const docsDone=s.docs==="Docs Received"||s.docs==="Complete";
  const shipDate=s.shipped_date||(past(s.etd)?s.etd:"");
  const hubc=s.transit_hub?(HUBC[s.transit_hub]||s.transit_hub):"";
  const M=[
    {t:"Order initiated",d:s.initiated,where:s.country,info:s.po?"PO "+s.po:"",done:!!(s.initiated||s.po||s.supplier_inv)},
    {t:"Supplier confirmed",info:s.supplier_inv?"Supplier invoice "+s.supplier_inv:"",done:!!s.supplier_inv||st>=2},
    {t:"Supplier documents",info:s.docs||"Not started",done:docsDone||st>=5,warn:s.docs==="Pending"},
    {t:"Import permit",info:s.permit||"Not set",done:s.permit==="Received"||s.permit==="No Need"||st>=7},
    {t:"Checks: COA · artwork · attestation",info:["COA "+(s.coa||"—"),"Artwork "+(s.artwork||"—"),"Attestation "+(s.attestation||"—")].join(" · "),done:(s.artwork==="Yes"&&(s.attestation==="Yes"))||st>=10},
    {t:"Booking from transit",d:s.booking,done:!!s.booking||st>=11},
    {t:"Shipped from supplier",d:shipDate,where:s.country,info:[s.method,s.tracking?"AWB/BL "+s.tracking:"",!shipDate&&s.etd?"ETD "+fd(s.etd):""].filter(Boolean).join(" · "),done:!!shipDate||st>=12},
    {t:"Arrived at transit hub",d:s.hub_date&&past(s.hub_date)?s.hub_date:"",where:hubc?s.transit_hub+", "+hubc:"",done:past(s.hub_date)||st>=13,skip:!s.transit_hub&&!s.hub_date&&st>=14},
    {t:"Original attested received in hub",done:!!s.orig_attested,skip:!s.transit_hub&&!s.hub_date},
    {t:"Forwarder approved for final destination",d:s.fwd_date,info:s.forwarder||"",done:!!s.fwd_ok,skip:!s.transit_hub&&!s.hub_date},
    {t:"Customs clearance",info:s.clearance_inv?"Clearance invoice "+s.clearance_inv:"",where:destOf(s),done:st>=14||past(s.final_date)},
    {t:"Arrived at final country",d:s.final_date,where:destOf(s),done:past(s.final_date)||st>=15},
    {t:"Payment",info:s.payment||"Not set",done:s.payment==="Paid",warn:s.payment==="Pending"||s.payment==="Partial"},
  ];
  if(s.second_release){
    M.push({t:"2nd release: submitted for analysis",d:s.date_submitted,info:s.submitted_by?"By "+s.submitted_by:"",done:!!s.date_submitted});
    M.push({t:"Released",d:s.release_date,info:s.remarks2||"",done:!!s.released});
  }
  const L=M.filter(m=>!m.skip);
  const cur=L.findIndex(m=>!m.done);if(cur>=0)L[cur].current=true;
  return L;
}

function closeDrawer(){$("#overlay").innerHTML="";D=null;if(pendingRender)render()}
async function saveDrawer(){
  const prev=S.ships.find(x=>x._id===D.s._id)||{};
  const s=readForm();
  if(!s.shipment_id){toast("Shipment ID is required");$("#f_shipment_id").focus();return}
  if(!D.stageTouched)s.stage=Math.max(+s.stage||1,autoStage(s));
  if(!!prev.final_arrived!==!!s.final_arrived)setArrived(s,!!s.final_arrived);
  else if(s.final_date&&s.final_date<=today()&&!s.final_arrived&&s.final_date!==prev.final_date)setArrived(s,true);
  if(s.orig_attested&&!prev.orig_attested&&s.attestation!=="Yes")s.attestation="Yes";
  // release automation from drawer changes
  const patch={};
  if(!!prev.second_release!==!!s.second_release)patch.second_release=s.second_release;
  if(+prev.stage!==+s.stage)patch.stage=s.stage;
  applyRelease(s,patch);
  if(s.flag==="cancelled"&&s.second_release&&!s.released)s.r_status="Cancelled";
  if(s.flag==="hold"&&s.second_release&&!s.released)s.r_status="On Hold";
  if(!s.flag&&s.second_release&&!s.released&&(s.r_status==="On Hold"||s.r_status==="Cancelled"))s.r_status="Under Analysis";
  if(s.fwd_ok&&!s.fwd_date)s.fwd_date=today();if(!s.fwd_ok)s.fwd_date="";
  if(!s.created)s.created=Date.now();
  if(s.permit==="Received"&&prev.permit!=="Received"){s.permit_date=today();setTimeout(()=>toast("Import permit confirmed for "+s.shipment_id+". It's now on the dashboard, ready to arrange."),1200)}
  if(s.permit!=="Received")s.permit_date="";
  const jb=jobFor(s);if(jb){s.job_id=jb._id;JOB_SYNC.forEach(([jk,sk])=>{if(!s[sk]&&jb[jk])s[sk]=jb[jk]})}
  s.progress=progress(s);
  closeDrawer();
  await persist(s);
  await syncShipToJob(s);
  toast(D===null?"Saved "+s.shipment_id:"Saved");
}

}
async function doUndo(id){
  const s=structuredClone(S.ships.find(x=>x._id===id));if(!s)return;const info=undoInfo(s);if(!info)return;

async function quick(act,id){
  if(act==="undo"){closeDrawer();await doUndo(id);return}
  const s=structuredClone(S.ships.find(x=>x._id===id));if(!s)return;
  if(act==="release")applyRelease(s,{released:true});
  else if(act==="unrelease")applyRelease(s,{released:false});
  else if(act==="hold")applyRelease(s,{r_status:s.r_status==="On Hold"?"Under Analysis":"On Hold"});
  else if(act==="remark")s.remarks2=$("#q_remark").value.trim();
  s.progress=progress(s);
  closeDrawer();await persist(s);toast(act==="remark"?"Remark saved":"Updated "+s.shipment_id);
}

  if(t.dataset.f!==undefined){S.f[t.dataset.f]=t.value;render();return}
  if(t.dataset.rf!==undefined){S.rf[t.dataset.rf]=t.value;render();return}
  if(t.id==="showDone"){S.showDone=t.checked;render();return}
  if(t.id==="rsort"){S.rsort=t.value;render();return}
  if(t.id==="selAll"){(S._relList||[]).forEach(s=>t.checked?S.sel.add(s._id):S.sel.delete(s._id));render();return}
  if(t.dataset.sel){t.checked?S.sel.add(t.dataset.sel):S.sel.delete(t.dataset.sel);render();return}
  if(t.dataset.sr){const s=structuredClone(S.ships.find(x=>x._id===t.dataset.sr));if(t.checked)setArrived(s,true);else applyRelease(s,{second_release:false});s.progress=progress(s);await persist(s);toast(t.checked?s.shipment_id+" marked arrived in "+destOf(s)+" and moved to 2nd Release":s.shipment_id+" moved back out of 2nd Release");return}
  if(t.dataset.jd){S.jobDraft[t.dataset.jd]=t.value;return}
  if(t.dataset.j){await updateJob(t.dataset.j,t.dataset.k,t.value.trim());if($(".sheet"))openJobEdit(t.dataset.j);return}
  if(t.dataset.c){await inlineEdit(t.dataset.c,t.dataset.k,t.type==="checkbox"?t.checked:t.value.trim());return}
  if(t.dataset.u){const u=S.settings.users&&S.settings.users.find(x=>x.id===t.dataset.u);if(!u)return;const k=t.dataset.uk;let v=t.value.trim();
    if(k==="user"){if(!v){toast("Username can't be empty");render(true);return}if(S.settings.users.some(x=>x.id!==u.id&&x.user.toLowerCase()===v.toLowerCase())){toast("That username is taken");render(true);return}}
    if(k==="admin"){v=v==="1";if(!v&&u.admin&&S.settings.users.filter(x=>x.admin).length<2){toast("Keep at least one admin");render(true);return}if(!v&&!(u.modules||[]).length)u.modules=ALLMODS.filter(m=>m!=="settings")}
    u[k]=v;saveSettings();return}
  if(t.dataset.um){const u=S.settings.users.find(x=>x.id===t.dataset.um);if(!u)return;const m=t.dataset.mod;const set=new Set(u.modules||[]);t.checked?set.add(m):set.delete(m);u.modules=ALLMODS.filter(x=>set.has(x));saveSettings();return}
  if(t.id==="relDone"){S.relDone=t.checked;render();return}
  if(t.id==="hubAll"){S.hubAll=t.checked;render();return}
  if(t.dataset.h){const s=structuredClone(S.ships.find(x=>x._id===t.dataset.h));const k=t.dataset.k;const v=t.type==="checkbox"?t.checked:t.value.trim();if(s[k]===v&&k!=="hub_recv"&&k!=="final_arrived")return;if(k==="orig_attested"&&v&&s.attestation!=="Yes")s.attestation="Yes";applyHub(s,{[k]:v});s.progress=progress(s);await persist(s);if(k==="final_arrived"&&v)toast(s.shipment_id+" arrived in "+destOf(s)+" and moved to 2nd Release");return}
  if(t.dataset.r){const s=structuredClone(S.ships.find(x=>x._id===t.dataset.r));const k=t.dataset.k;const v=t.type==="checkbox"?t.checked:t.value.trim();if(s[k]===v)return;if(k==="date_submitted"&&v&&!s.submitted_by&&me())s.submitted_by=me().name||me().user;applyRelease(s,{[k]:v});s.progress=progress(s);await persist(s);if(k==="released"&&v)toast(s.shipment_id+" released and moved to Completed");return}
  if(t.dataset.sup!=null){S.settings.suppliers[+t.dataset.sup].group=t.value;saveSettings();return}
  if(t.dataset.grp!=null){S.settings.groups[+t.dataset.grp][t.dataset.gk]=t.value;saveSettings();return}
  if(t.dataset.pref){const k=t.dataset.pref;S.settings[k]=k==="currency"?t.value.trim().toUpperCase().slice(0,3)||"USD":k==="destCountry"?t.value:Math.max(1,+t.value||1);saveSettings();return}
  // drawer automation
  if(D&&t.closest("#shipForm")){
    const fm=$("#shipForm");
    if(t.name==="stage")D.stageTouched=true;
    if(t.name==="supplier"){const sup=S.settings.suppliers.find(x=>x.name===t.value);if(sup&&sup.group){fm.elements.group.value=sup.group;applyGroup(fm,sup.group)}}
    if(t.name==="group")applyGroup(fm,t.value);
    if(t.name!=="stage"&&!D.stageTouched){const tmp={...D.s};[...fm.elements].forEach(el=>{if(el.name)tmp[el.name]=el.type==="checkbox"?el.checked:el.value});const a=autoStage(tmp);if(a>(+fm.elements.stage.value||1))fm.elements.stage.value=a}
  }
});
function applyGroup(fm,name){
  const g=S.settings.groups.find(x=>x.name===name);if(!g)return;
  const set=(k,v)=>{if(!v)return;const el=fm.elements[k];if(![...el.options].some(o=>o.value===v)){const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)}el.value=v};
  set("country",g.country);set("ref_std",g.ref);set("coa",g.coa);
}
document.addEventListener("submit",e=>{
  const f=e.target;e.preventDefault();
  if(f.dataset.form==="job"){addJob();return}
  if(f.dataset.form==="user"){const fd2=new FormData(f);const name=String(fd2.get("name")).trim(),user=String(fd2.get("user")).trim(),pass=String(fd2.get("pass")),admin=fd2.get("role")==="1";
    if(!user||!name){toast("Enter a name and username");return}if(pass.length<4){toast("Use a password of at least 4 characters");return}
    const us=users();if(us.some(x=>String(x.user).toLowerCase()===user.toLowerCase())){toast("That username is taken");return}
    ensureUsers();
    let n=1;while(S.settings.users.some(x=>x.id==="u"+n))n++;const id="u"+n;
    S.settings.users.push({id,user,name,admin,modules:admin?ALLMODS:ALLMODS.filter(m=>m!=="settings"),hash:pwHash(id,pass).slice(0,32)});saveSettings();toast("Added "+user);return}
  if(f.id==="loginForm"){
    if(!S.setLoaded){$("#loginErr").textContent="Still connecting. Try again in a moment.";return}
    const u=$("#lu").value.trim(),p=$("#lp").value;
    const x=users().find(z=>String(z.user).toLowerCase()===u.toLowerCase());
    const ok=x&&(x.legacy?p===x.pass:(x.hash===pwHash(x.id,p)||x.hash===pwHash(x.id,p).slice(0,32)));
    if(!ok){$("#loginErr").textContent="Username or password is incorrect.";return}
    if(x.disabled){$("#loginErr").textContent="This account is switched off. Ask an admin.";return}
    S.meId=x.id;lsSet("shiptrack-auth",x.id);$("#loginErr").textContent="";
    if(x.legacy){S.settings.users=[{id:"u1",user:x.user,name:x.user==="rony"?"Rony":x.user,admin:true,modules:ALLMODS,hash:pwHash("u1",p).slice(0,32)}];delete S.settings.auth;showApp();saveSettings();return}
    showApp();return;
  }
  const kind=f.dataset.form,fd_=new FormData(f),st=S.settings;
  if(kind==="sup"){const n=String(fd_.get("name")).trim();if(!n)return;if(st.suppliers.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast(n+" is already listed");return}st.suppliers.push({name:n,group:fd_.get("group")||""})}
  else if(kind==="grp"){const n=String(fd_.get("name")).trim();if(!n)return;if(st.groups.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast(n+" is already listed");return}st.groups.push({name:n,country:fd_.get("country")||"",ref:"No Need",coa:"No"})}
  else if(kind==="arr"){const n=String(fd_.get("v")).trim();const arr=st[f.dataset.arr];if(!n||arr.includes(n))return;arr.push(n)}
  else if(kind==="list"){const n=String(fd_.get("v")).trim();const arr=st.lists[f.dataset.list];if(!n||arr.includes(n))return;arr.push(n)}
  else if(kind==="auth"){const u=String(fd_.get("user")).trim(),p=String(fd_.get("pass"));if(!u||p.length<4){toast("Use a password of at least 4 characters");return}st.auth={user:u,pass:p};toast("Sign-in updated")}
  else return;
  saveSettings();
});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(pendingRender)render()},0)});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.jd)S.jobDraft[t.dataset.jd]=t.value});
$("#q").addEventListener("input",e=>{S.q=e.target.value;render()});
$("#newBtn").addEventListener("click",newShip);
function signOut(msg){lsDel("shiptrack-auth");S.meId=null;closeDrawer();$("#app").hidden=true;$("#login").hidden=false;$("#lp").value="";$("#loginErr").textContent=msg||""}
$("#logoutBtn").addEventListener("click",()=>signOut());
function toggleBell(){
  if($(".pop")){$(".pop").remove();return}
  const al=alerts();const p=document.createElement("div");p.className="pop";p.setAttribute("role","dialog");p.setAttribute("aria-label","Notifications");
  p.innerHTML=`<div class="panel-h"><h2 style="font-size:16px">Notifications</h2><span class="eyebrow">${al.length}</span></div><div class="alerts">${al.map(a=>`<div class="alert ${a.lvl}" data-open="${esc(a.id)}" role="button" tabindex="0"><i></i><span>${esc(a.txt)}</span><small>${esc(a.sub)}</small></div>`).join("")||'<span style="color:var(--muted)">You\'re all caught up.</span>'}</div>`;
  document.body.appendChild(p);
}
/* long-press for tab 2 cards */
let lp=null,lpFired=false;
document.addEventListener("pointerdown",e=>{const c=e.target.closest("[data-rcard]");if(!c)return;lpFired=false;const id=c.dataset.rcard,x=e.clientX,y=e.clientY;lp={x,y,t:setTimeout(()=>{lpFired=true;openSheet(id)},550)}});
document.addEventListener("pointermove",e=>{if(lp&&(Math.abs(e.clientX-lp.x)>8||Math.abs(e.clientY-lp.y)>8)){clearTimeout(lp.t);lp=null}});
document.addEventListener("pointerup",e=>{if(!lp)return;clearTimeout(lp.t);const c=e.target.closest("[data-rcard]");if(!lpFired&&c)openShip(c.dataset.rcard);lp=null});
document.addEventListener("contextmenu",e=>{if(e.target.closest("[data-rcard]"))e.preventDefault()});

/* ================= boot ================= */
function showApp(){$("#login").hidden=true;$("#app").hidden=false;render()}
const h0=(location.hash||"").slice(1);if(VIEWS.some(v=>v[0]===h0))S.view=h0;
S.meId=lsGet("shiptrack-auth");if(S.meId)showApp();else{$("#login").hidden=false}
initData();
(async()=>{try{if(window.claude&&window.claude.use){S.dl=await window.claude.use("downloads");render()}}catch(e){}})();
})();
</script>
